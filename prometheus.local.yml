global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: events-microservices
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - config-server:8888
          - eureka-server:8761
          - api-gateway:8080
          - participant-service:8081
          - logistics-service:8082
          - event-service:8083

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: prometheus
    scrape_native_histograms: true