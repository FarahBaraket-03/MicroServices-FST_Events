server:
  port: ${PORT:8093}
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
    url: ${DB_URL:jdbc:mysql://localhost:3309/event_db}
    username: ${DB_USER:events}
    password: ${DB_PASSWORD:events_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 5000
      micrometer:
        enabled: true
    loadbalancer:
      retry:
        enabled: false
app:
  cost-job-enabled: ${COST_JOB_ENABLED:false}
resilience4j:
  retry:
    instances:
      participantRead:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - tn.fst.eventservice.RemoteDependencyException
      logisticsRead:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - tn.fst.eventservice.RemoteDependencyException
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        minimumNumberOfCalls: 6
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - tn.fst.eventservice.RemoteDependencyException
    instances:
      participantRead:
        baseConfig: default
      logisticsRead:
        baseConfig: default
  ratelimiter:
    instances:
      eventApi:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0
