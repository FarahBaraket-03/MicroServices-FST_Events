server:
  port: ${PORT:8091}
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
    url: ${DB_URL:jdbc:mysql://localhost:3307/participant_db}
    username: ${DB_USER:events}
    password: ${DB_PASSWORD:events_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  demo-faults-enabled: ${DEMO_FAULTS_ENABLED:false}
